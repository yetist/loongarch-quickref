    format: 1RI20 型
    isa: *id001
    equation: tmp = PC + SignExtend({si20, 12'b0}, GRLEN); GR[rd] = {tmp[GRLEN-1:12], 12'b0}
    description: 以 `PC` 为基准加上 20 位立即数 `si20` 左移 12 位后的值，结果写入 `rd`。
