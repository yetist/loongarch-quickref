- letter: B
  title: B · 位操作、分支与断点指令
  note: 本章收录 23 条以 B 开头的指令。分支指令的 `offs` 为汇编中的字节偏移；位图中的 `offs[...]` 表示编码后的字偏移字段（`offs >> 2`）。`offs16`、`offs21`、`offs26` 的字节范围分别约为 ±128 KB、±4 MB、±128 MB。`bceqz`/`bcnez` 的 `cj` 为条件标志寄存器号 0～7，汇编名为 `$fcc0`～`$fcc7`。
  instructions:
  - mnemonic: b
    operands: offs
    cn_name: 无条件跳转
    en_name: Unconditional Branch
    format: I26 型
    isa:
    - LA32
    - LA64
    equation: PC = PC + SignExtend(offs, GRLEN)
    description: 无条件跳转到 `PC + offs`。`offs` 为 26 位有符号字偏移 `offs26 << 2`，即字节偏移。
    example: b 8
    example_comment: '# PC = PC + 8'
    pseudocode: PC = PC + SignExtend(offs, GRLEN)
    encoding:
    - bits:
      - 31
      - 26
      value: '010100'
      kind: fixed
    - bits:
      - 25
      - 10
      value: offs[15:0]
      kind: imm
    - bits:
      - 9
      - 0
      value: offs[25:16]
      kind: imm
    base: '0x50000000'
    encoding_value: 0x50000000 | (((offs >> 2) & 0xffff) << 10) | (((offs >> 2) >> 16) & 0x3ff)
  - mnemonic: bceqz
    operands: cj, offs
    cn_name: 条件标志为零跳转
    en_name: Branch if Condition Flag Equal to Zero
    format: 1RI21 型
    isa:
    - LA32
    - LA64
    equation: if (CFR[cj] == 0) PC = PC + SignExtend(offs, GRLEN)
    description: 当条件标志寄存器 `cj` 的值为 0 时跳转到 `PC + offs`，否则顺序执行。`cj` 为 0～7，汇编名为 `$fcc0`～`$fcc7`。
    example: bceqz $fcc0, 8
    example_comment: '# if ($fcc0 == 0) PC += 8'
    pseudocode: "if (CFR[cj] == 0)\n    PC = PC + SignExtend(offs, GRLEN)"
    encoding:
    - bits:
      - 31
      - 26
      value: '010010'
      kind: fixed
    - bits:
      - 25
      - 10
      value: offs[15:0]
      kind: imm
    - bits:
      - 9
      - 8
      value: '00'
      kind: fixed
    - bits:
      - 7
      - 5
      value: cj
      kind: reg
    - bits:
      - 4
      - 0
      value: offs[20:16]
      kind: imm
    base: '0x48000000'
    encoding_value: 0x48000000 | (((offs >> 2) & 0xffff) << 10) | (cj << 5) | (((offs >> 2) >> 16) & 0x1f)
    extra_tags:
    - F
  - mnemonic: bcnez
    operands: cj, offs
    cn_name: 条件标志非零跳转
    en_name: Branch if Condition Flag Not Equal to Zero
    format: 1RI21 型
    isa:
    - LA32
    - LA64
    equation: if (CFR[cj] != 0) PC = PC + SignExtend(offs, GRLEN)
    description: 当条件标志寄存器 `cj` 的值不为 0 时跳转到 `PC + offs`，否则顺序执行。`cj` 为 0～7，汇编名为 `$fcc0`～`$fcc7`。
    example: bcnez $fcc0, 8
    example_comment: '# if ($fcc0 != 0) PC += 8'
    pseudocode: "if (CFR[cj] != 0)\n    PC = PC + SignExtend(offs, GRLEN)"
    encoding:
    - bits:
      - 31
      - 26
      value: '010010'
      kind: fixed
    - bits:
      - 25
      - 10
      value: offs[15:0]
      kind: imm
    - bits:
      - 9
      - 8
      value: '01'
      kind: fixed
    - bits:
      - 7
      - 5
      value: cj
      kind: reg
    - bits:
      - 4
      - 0
      value: offs[20:16]
      kind: imm
    base: '0x48000100'
    encoding_value: 0x48000100 | (((offs >> 2) & 0xffff) << 10) | (cj << 5) | (((offs >> 2) >> 16) & 0x1f)
    extra_tags:
    - F
  - mnemonic: beq
    operands: rj, rd, offs
    cn_name: 相等跳转
    en_name: Branch if Equal
    format: 2RI16 型
    isa:
    - LA32
    - LA64
    equation: if (GR[rj] == GR[rd]) PC = PC + SignExtend(offs, GRLEN)
    description: 比较 `rj` 与 `rd`，相等时跳转到 `PC + offs`，否则顺序执行。`offs` 为 16 位有符号字偏移 `offs16 << 2`，即字节偏移。
    example: beq $a0, $a1, 8
    example_comment: '# if ($a0 == $a1) PC += 8'
    pseudocode: "if (GR[rj] == GR[rd])\n    PC = PC + SignExtend(offs, GRLEN)"
    encoding:
