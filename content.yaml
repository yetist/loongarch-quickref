- letter: J
  title: J · 间接跳转指令
  note: ''
  instructions:
  - mnemonic: jirl
    operands: rd, rj, offs
    cn_name: 间接跳转并链接
    en_name: Jump and Link Register
    format: 2RI16 型
    isa: *id001
    equation: GR[rd] = PC + 4; PC = GR[rj] + SignExtend(offs, GRLEN)
    description: 将 `PC + 4` 写入 `rd`，并跳转到 `rj + offs`。`offs` 为汇编中的字节偏移，编码字段为 `offs >> 2`。
    example: jirl $a0, $a1, 8
    example_comment: '# $a0 = PC + 4; PC = $a1 + 8'
    pseudocode: 'GR[rd] = PC + 4

      PC = GR[rj] + SignExtend(offs, GRLEN)'
    encoding:
    - bits:
      - 31
      - 26
      value: '010011'
      kind: fixed
    - bits:
      - 25
      - 10
      value: offs[15:0]
      kind: imm
    - bits:
      - 9
      - 5
      value: rj
      kind: reg
    - bits:
      - 4
      - 0
      value: rd
      kind: reg
    base: '0x4c000000'
    encoding_value: 0x4c000000 | (((offs >> 2) & 0xffff) << 10) | (rj << 5) | rd
- letter: L
  title: L · 加载、链接加载、页表与立即数装载指令
  note: 本章中的加载/存储地址为 `GR[rj] + 立即数` 或 `GR[rj] + GR[rk]`。`si12`/`si14` 为字节偏移，直接参与地址计算。
