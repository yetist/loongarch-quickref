- letter: N
  title: N · 或非指令
  note: ''
  instructions:
  - mnemonic: nor
    operands: rd, rj, rk
    cn_name: 按位或非
    en_name: Bitwise NOR
    format: 3R 型
    isa: *id001
    equation: GR[rd] = ~(GR[rj] | GR[rk])
    description: 将 `rj`、`rk` 按位或后取反，结果写入 `rd`。
    example: nor $a0, $a1, $a2
    example_comment: '# $a0 = ~($a1 | $a2)'
    pseudocode: GR[rd] = ~(GR[rj] | GR[rk])
    encoding:
