- letter: X
  title: X · 异或指令
  note: ''
  instructions:
  - mnemonic: xor
    operands: rd, rj, rk
    cn_name: 按位异或
    en_name: Bitwise XOR
    format: 3R 型
    isa: *id001
    equation: GR[rd] = GR[rj] ^ GR[rk]
    description: 将 `rj`、`rk` 按位异或，结果写入 `rd`。
    example: xor $a0, $a1, $a2
    example_comment: '# $a0 = $a1 ^ $a2'
    pseudocode: GR[rd] = GR[rj] ^ GR[rk]
    encoding:
    - bits:
      - 31
      - 25
      value: '0000000'
      kind: fixed
    - bits:
      - 24
      - 20
      value: '00001'
      kind: fixed
    - bits:
      - 19
      - 15
      value: '01011'
      kind: fixed
    - bits:
      - 14
      - 10
      value: rk
      kind: reg
    - bits:
      - 9
      - 5
      value: rj
      kind: reg
    - bits:
      - 4
      - 0
      value: rd
      kind: reg
    base: '0x00158000'
    encoding_value: 0x00158000 | (rk << 10) | (rj << 5) | rd
  - mnemonic: xori
    operands: rd, rj, ui12
    cn_name: 立即数按位异或
    en_name: Bitwise XOR Immediate
    format: 2RI12 型
    isa: *id001
    equation: GR[rd] = GR[rj] ^ ZeroExtend(ui12, GRLEN)
    description: 将 `rj` 与零扩展的 12 位立即数按位异或，结果写入 `rd`。
    example: xori $a0, $a1, 0xff
    example_comment: '# $a0 = $a1 ^ 0xff'
    pseudocode: GR[rd] = GR[rj] ^ ZeroExtend(ui12, GRLEN)
    encoding:
    - bits:
      - 31
      - 22
      value: '0000001111'
      kind: fixed
    - bits:
      - 21
      - 10
      value: ui12
      kind: imm
    - bits:
      - 9
      - 5
      value: rj
      kind: reg
    - bits:
      - 4
      - 0
      value: rd
      kind: reg
    base: '0x03c00000'
    encoding_value: 0x03c00000 | ((ui12 & 0xfff) << 10) | (rj << 5) | rd
