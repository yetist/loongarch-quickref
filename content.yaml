      value: offs[20:16]
      kind: imm
    base: '0x40000000'
    encoding_value: 0x40000000 | (((offs >> 2) & 0xffff) << 10) | (rj << 5) | (((offs >> 2) >> 16) & 0x1f)
  - mnemonic: bge
    operands: rj, rd, offs
    cn_name: 有符号大于等于跳转
    en_name: Branch if Greater Than or Equal
