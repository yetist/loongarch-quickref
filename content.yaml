    isa: *id001
    equation: GR[rd] = PC + SignExtend({si20, 2'b0}, GRLEN)
    description: 以 `PC` 为基准加上 20 位立即数 `si20` 左移 2 位后的值，结果写入 `rd`。
    example: pcaddi $a0, 1
    example_comment: '# $a0 = PC + (1 << 2)'
