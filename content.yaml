document:
  title: 龙芯架构指令速查表
  subtitle: 卷一 · 基础架构
  scope: A – Z 字母
chapters:
- letter: A
  title: A · 算术、逻辑、原子与边界检查指令
  note: 本章收录全部以 A 开头的指令。约定：`GR[x]` 表示第 x 号通用寄存器；`GRLEN` 在 LA32 中为 32，在 LA64 中为 64；位域编号从 31 到 0。位图中固定编码字段以浅灰底标示，寄存器号与立即数字段为白底。
  section_notes:
    amadd.b:
      title: 原子指令通用规则
      html: <p>AM* 指令对 <code>GR[rj]</code> 指向的内存单元执行原子的“读—改—写”：旧值符号扩展至 GRLEN 位后写入 <code>GR[rd]</code>，新值写回该内存单元。下文中 <code>[rj]</code> 表示 <code>GR[rj]</code> 指向的内存单元。</p><ul><li>地址必须自然对齐，否则触发非对齐异常；字节访问（<code>.b</code>）无此限制。</li><li><code>_db</code> 变体在操作前后附加数据屏障（DB）。</li><li>官方规定：<code>amswap</code>/<code>amadd</code>/<code>amand</code>/<code>amor</code>/<code>amxor</code>/<code>ammax</code>/<code>ammin</code> 的 W/D 类要求 <code>rd ≠ rj</code>，否则触发指令未定义异常；<code>amswap</code>/<code>amadd</code> 的 B/H 变体允许 <code>rd = rj</code>。<code>rd = rk</code> 时结果不确定，软件应避免。</li></ul>
  instructions:
  - mnemonic: add.d
    operands: rd, rj, rk
    cn_name: 双字整数加法
    en_name: Add Doubleword
    format: 3R 型
    isa:
    - LA64
    equation: GR[rd] = GR[rj][63:0] + GR[rk][63:0]
    description: 将通用寄存器 `rj`、`rk` 中的 64 位数据相加，结果写入 `rd`。不进行溢出检测。
    example: add.d $a0, $a1, $a2
    example_comment: '# $a0 = $a1 + $a2'
    pseudocode: 'tmp = GR[rj][63:0] + GR[rk][63:0]

      GR[rd] = tmp[63:0]'
    encoding:
    - bits:
      - 31
      - 25
      value: '0000000'
      kind: fixed
    - bits:
      - 24
      - 20
      value: '00001'
      kind: fixed
    - bits:
      - 19
      - 15
      value: '00001'
      kind: fixed
    - bits:
      - 14
      - 10
      value: rk
      kind: reg
    - bits:
      - 9
      - 5
      value: rj
      kind: reg
    - bits:
      - 4
      - 0
      value: rd
      kind: reg
    base: '0x00108000'
    encoding_value: 0x00108000 | (rk << 10) | (rj << 5) | rd
  - mnemonic: add.w
    operands: rd, rj, rk
    cn_name: 字整数加法
    en_name: Add Word
    format: 3R 型
    isa:
    - LA32
    - LA64
    equation: GR[rd] = SignExtend(GR[rj][31:0] + GR[rk][31:0], GRLEN)
    description: 将通用寄存器 `rj`、`rk` 中的低 32 位数据相加，结果符号扩展至 GRLEN 位后写入 `rd`。不进行溢出检测。
    example: add.w $a0, $a1, $a2
    example_comment: '# $a0 = $a1 + $a2'
    pseudocode: 'tmp = GR[rj][31:0] + GR[rk][31:0]

      GR[rd] = SignExtend(tmp[31:0], GRLEN)'
    encoding:
    - bits:
      - 31
      - 25
      value: '0000000'
      kind: fixed
    - bits:
      - 24
      - 20
      value: '00001'
      kind: fixed
    - bits:
      - 19
      - 15
      value: '00000'
      kind: fixed
    - bits:
      - 14
      - 10
      value: rk
      kind: reg
    - bits:
      - 9
      - 5
      value: rj
      kind: reg
    - bits:
      - 4
      - 0
      value: rd
      kind: reg
    base: '0x00100000'
    encoding_value: 0x00100000 | (rk << 10) | (rj << 5) | rd
  - mnemonic: addi.d
    operands: rd, rj, si12
    cn_name: 双字立即数加法
    en_name: Add Immediate Doubleword
    format: 2RI12 型
    isa:
    - LA64
    equation: GR[rd] = GR[rj][63:0] + SignExtend(si12, 64)
    description: 将 `rj` 的 64 位数据与符号扩展后的 12 位立即数 `si12` 相加，结果写入 `rd`。`si12` 的取值范围为 −2048～2047。不进行溢出检测。
    example: addi.d $a0, $a1, -16
    example_comment: '# $a0 = $a1 - 16'
    pseudocode: 'tmp = GR[rj][63:0] + SignExtend(si12, 64)

      GR[rd] = tmp[63:0]'
    encoding:
    - bits:
      - 31
      - 22
      value: '0000001011'
      kind: fixed
    - bits:
      - 21
      - 10
      value: si12
      kind: imm
    - bits:
      - 9
      - 5
      value: rj
      kind: reg
    - bits:
      - 4
      - 0
      value: rd
      kind: reg
    base: '0x02c00000'
    encoding_value: 0x02c00000 | ((si12 & 0xfff) << 10) | (rj << 5) | rd
  - mnemonic: addi.w
    operands: rd, rj, si12
    cn_name: 字立即数加法
    en_name: Add Immediate Word
    format: 2RI12 型
    isa:
    - LA32
    - LA64
    equation: GR[rd] = SignExtend(GR[rj][31:0] + SignExtend(si12, 32), GRLEN)
    description: 将 `rj` 的低 32 位与符号扩展后的 12 位立即数 `si12` 相加，结果符号扩展至 GRLEN 位后写入 `rd`。`si12` 的取值范围为 −2048～2047。不进行溢出检测。
    example: addi.w $a0, $a1, -16
    example_comment: '# $a0 = $a1 - 16'
    pseudocode: 'tmp = GR[rj][31:0] + SignExtend(si12, 32)

      GR[rd] = SignExtend(tmp[31:0], GRLEN)'
    encoding:
    - bits:
      - 31
      - 22
      value: '0000001010'
      kind: fixed
    - bits:
      - 21
      - 10
      value: si12
      kind: imm
    - bits:
      - 9
      - 5
      value: rj
      kind: reg
    - bits:
      - 4
      - 0
      value: rd
      kind: reg
    base: '0x02800000'
    encoding_value: 0x02800000 | ((si12 & 0xfff) << 10) | (rj << 5) | rd
  - mnemonic: addu16i.d
    operands: rd, rj, si16
    cn_name: 双字 16 位立即数加法
    en_name: Add 16-bit Immediate Doubleword
    format: 2RI16 型
    isa:
    - LA64
    equation: GR[rd] = GR[rj] + SignExtend({si16, 16'b0}, 64)
    description: 将 16 位立即数 `si16` 逻辑左移 16 位后符号扩展至 64 位，再与 `rj` 相加，结果写入 `rd`。`si16` 的取值范围为 −32768～32767。该指令常与 `ldptr.w/d`、`stptr.w/d` 配合，用于位置无关代码的 GOT 表访问。不进行溢出检测。
    example: addu16i.d $a0, $a1, 1
    example_comment: '# $a0 = $a1 + 0x10000'
    pseudocode: 'tmp = GR[rj][63:0] + SignExtend({si16, 16''b0}, 64)

      GR[rd] = tmp[63:0]'
    encoding:
    - bits:
      - 31
      - 26
      value: '000100'
      kind: fixed
    - bits:
      - 25
      - 10
      value: si16
      kind: imm
    - bits:
      - 9
      - 5
      value: rj
      kind: reg
    - bits:
      - 4
      - 0
      value: rd
      kind: reg
    base: '0x10000000'
    encoding_value: 0x10000000 | ((si16 & 0xffff) << 10) | (rj << 5) | rd
  - mnemonic: alsl.d
    operands: rd, rj, rk, sa
    cn_name: 双字左移加法
    en_name: Add Shifted Left Doubleword
    format: 3R 型
    isa:
    - LA64
    equation: GR[rd] = (GR[rj][63:0] << sa) + GR[rk][63:0]
    description: 将 `rj` 的 64 位数据左移 `sa` 位，加上 `rk` 的 64 位数据，结果写入 `rd`。`sa` 的取值范围为 1～4。不进行溢出检测。
    example: alsl.d $a0, $a1, $a2, 2
    example_comment: '# $a0 = ($a1 << 2) + $a2'
    pseudocode: 'tmp = (GR[rj][63:0] << sa) + GR[rk][63:0]

      GR[rd] = tmp[63:0]'
    encoding:
    - bits:
      - 31
      - 19
      value: '0000000000101'
      kind: fixed
    - bits:
      - 18
      - 17
      value: '10'
      kind: fixed
    - bits:
      - 16
      - 15
      value: sa-1
      kind: shift
    - bits:
      - 14
      - 10
      value: rk
      kind: reg
    - bits:
      - 9
      - 5
      value: rj
      kind: reg
    - bits:
      - 4
      - 0
      value: rd
      kind: reg
    base: '0x002c0000'
    encoding_value: 0x002c0000 | (((sa - 1) & 0x3) << 15) | (rk << 10) | (rj << 5) | rd
    note: 编码字段为 `sa-1`（2 位）。官方手册把该 2 位编码字段记为 `sa2`，并规定实际移位量为 `sa2+1`；汇编时直接填写实际移位量（1～4）。本手册语法用 `sa` 表示该实际移位量。
  - mnemonic: alsl.w
    operands: rd, rj, rk, sa
    cn_name: 字左移加法
    en_name: Add Shifted Left Word
    format: 3R 型
    isa:
    - LA32
    - LA64
    equation: GR[rd] = SignExtend((GR[rj][31:0] << sa) + GR[rk][31:0], GRLEN)
    description: 将 `rj` 的低 32 位左移 `sa` 位，加上 `rk` 的低 32 位，结果符号扩展至 GRLEN 位后写入 `rd`。`sa` 的取值范围为 1～4。不进行溢出检测。
    example: alsl.w $a0, $a1, $a2, 2
    example_comment: '# $a0 = ($a1 << 2) + $a2'
    pseudocode: 'tmp = (GR[rj][31:0] << sa) + GR[rk][31:0]

      GR[rd] = SignExtend(tmp[31:0], GRLEN)'
    encoding:
    - bits:
      - 31
      - 19
      value: '0000000000000'
      kind: fixed
    - bits:
      - 18
      - 17
      value: '10'
      kind: fixed
    - bits:
      - 16
      - 15
      value: sa-1
      kind: shift
    - bits:
      - 14
      - 10
      value: rk
      kind: reg
    - bits:
      - 9
      - 5
      value: rj
      kind: reg
    - bits:
      - 4
      - 0
      value: rd
      kind: reg
    base: '0x00040000'
    encoding_value: 0x00040000 | (((sa - 1) & 0x3) << 15) | (rk << 10) | (rj << 5) | rd
    note: 编码字段为 `sa-1`（2 位）。官方手册把该 2 位编码字段记为 `sa2`，并规定实际移位量为 `sa2+1`；汇编时直接填写实际移位量（1～4）。本手册语法用 `sa` 表示该实际移位量。
  - mnemonic: alsl.wu
    operands: rd, rj, rk, sa
    cn_name: 字左移加法（零扩展）
    en_name: Add Shifted Left Word Unsigned
    format: 3R 型
    isa:
    - LA64
    equation: GR[rd] = ZeroExtend((GR[rj][31:0] << sa) + GR[rk][31:0], GRLEN)
    description: 将 `rj` 的低 32 位左移 `sa` 位，加上 `rk` 的低 32 位，结果零扩展至 GRLEN 位后写入 `rd`。`sa` 的取值范围为 1～4。不进行溢出检测。
    example: alsl.wu $a0, $a1, $a2, 2
    example_comment: '# $a0 = ($a1 << 2) + $a2'
    pseudocode: 'tmp = (GR[rj][31:0] << sa) + GR[rk][31:0]

      GR[rd] = ZeroExtend(tmp[31:0], GRLEN)'
    encoding:
    - bits:
      - 31
      - 19
      value: '0000000000000'
      kind: fixed
    - bits:
      - 18
      - 17
      value: '11'
      kind: fixed
    - bits:
      - 16
      - 15
      value: sa-1
      kind: shift
    - bits:
      - 14
      - 10
      value: rk
      kind: reg
    - bits:
      - 9
      - 5
      value: rj
      kind: reg
    - bits:
      - 4
      - 0
      value: rd
      kind: reg
    base: '0x00060000'
    encoding_value: 0x00060000 | (((sa - 1) & 0x3) << 15) | (rk << 10) | (rj << 5) | rd
    note: 编码字段为 `sa-1`（2 位）。官方手册把该 2 位编码字段记为 `sa2`，并规定实际移位量为 `sa2+1`；汇编时直接填写实际移位量（1～4）。本手册语法用 `sa` 表示该实际移位量。
  - mnemonic: amadd.b
    operands: rd, rk, rj
    cn_name: 字节原子加法
    en_name: Atomic Add Byte
    format: 3R 型
    isa:
    - LA64
    equation: GR[rd] = old; Mem[GR[rj]] = old + GR[rk]
    description: 原子加法：读出 `[rj]` 中的 8 位旧值，符号扩展至 GRLEN 位后写入 `rd`；将旧值与 `rk` 的低 8 位相加，结果写回 `[rj]`。整个“读—改—写”过程原子完成。
    example: amadd.b $a0, $a1, $a2
    example_comment: '# [mem] += $a1[7:0]; $a0 = old'
    pseudocode: 'old = Memory[GR[rj], 8]

      GR[rd] = SignExtend(old, GRLEN)

      Memory[GR[rj], 8] = old + GR[rk][7:0]'
    encoding:
    - bits:
      - 31
      - 25
      value: '0011100'
      kind: fixed
    - bits:
      - 24
      - 20
      value: '00101'
      kind: fixed
    - bits:
      - 19
      - 15
      value: '11010'
      kind: fixed
    - bits:
      - 14
      - 10
      value: rk
      kind: reg
    - bits:
      - 9
      - 5
      value: rj
      kind: reg
    - bits:
      - 4
      - 0
      value: rd
      kind: reg
    base: '0x385d0000'
    encoding_value: 0x385d0000 | (rk << 10) | (rj << 5) | rd
  - mnemonic: amadd.d
    operands: rd, rk, rj
    cn_name: 双字原子加法
    en_name: Atomic Add Doubleword
    format: 3R 型
    isa:
    - LA64
    equation: GR[rd] = old; Mem[GR[rj]] = old + GR[rk]
    description: 原子加法：读出 `[rj]` 中的 64 位旧值，符号扩展至 GRLEN 位后写入 `rd`；将旧值与 `rk` 的低 64 位相加，结果写回 `[rj]`。地址必须自然对齐，否则触发非对齐异常。整个“读—改—写”过程原子完成。
    example: amadd.d $a0, $a1, $a2
    example_comment: '# [mem] += $a1[63:0]; $a0 = old'
    pseudocode: 'old = Memory[GR[rj], 64]

      GR[rd] = SignExtend(old, GRLEN)

      Memory[GR[rj], 64] = old + GR[rk][63:0]'
    encoding:
    - bits:
      - 31
      - 25
      value: '0011100'
      kind: fixed
    - bits:
      - 24
      - 20
      value: '00110'
      kind: fixed
    - bits:
      - 19
      - 15
      value: '00011'
      kind: fixed
    - bits:
      - 14
      - 10
      value: rk
      kind: reg
    - bits:
      - 9
      - 5
      value: rj
      kind: reg
    - bits:
      - 4
      - 0
      value: rd
      kind: reg
    base: '0x38618000'
    encoding_value: 0x38618000 | (rk << 10) | (rj << 5) | rd
  - mnemonic: amadd.h
    operands: rd, rk, rj
    cn_name: 半字原子加法
    en_name: Atomic Add Halfword
    format: 3R 型
    isa:
    - LA64
    equation: GR[rd] = old; Mem[GR[rj]] = old + GR[rk]
    description: 原子加法：读出 `[rj]` 中的 16 位旧值，符号扩展至 GRLEN 位后写入 `rd`；将旧值与 `rk` 的低 16 位相加，结果写回 `[rj]`。地址必须自然对齐，否则触发非对齐异常。整个“读—改—写”过程原子完成。
    example: amadd.h $a0, $a1, $a2
    example_comment: '# [mem] += $a1[15:0]; $a0 = old'
    pseudocode: 'old = Memory[GR[rj], 16]

      GR[rd] = SignExtend(old, GRLEN)

      Memory[GR[rj], 16] = old + GR[rk][15:0]'
    encoding:
    - bits:
      - 31
      - 25
      value: '0011100'
      kind: fixed
    - bits:
      - 24
      - 20
      value: '00101'
      kind: fixed
    - bits:
      - 19
      - 15
      value: '11011'
      kind: fixed
    - bits:
      - 14
      - 10
      value: rk
      kind: reg
    - bits:
      - 9
      - 5
      value: rj
      kind: reg
    - bits:
      - 4
      - 0
      value: rd
      kind: reg
    base: '0x385d8000'
    encoding_value: 0x385d8000 | (rk << 10) | (rj << 5) | rd
  - mnemonic: amadd.w
    operands: rd, rk, rj
    cn_name: 字原子加法
    en_name: Atomic Add Word
    format: 3R 型
    isa:
    - LA64
    equation: GR[rd] = old; Mem[GR[rj]] = old + GR[rk]
    description: 原子加法：读出 `[rj]` 中的 32 位旧值，符号扩展至 GRLEN 位后写入 `rd`；将旧值与 `rk` 的低 32 位相加，结果写回 `[rj]`。地址必须自然对齐，否则触发非对齐异常。整个“读—改—写”过程原子完成。
    example: amadd.w $a0, $a1, $a2
    example_comment: '# [mem] += $a1[31:0]; $a0 = old'
    pseudocode: 'old = Memory[GR[rj], 32]

      GR[rd] = SignExtend(old, GRLEN)

      Memory[GR[rj], 32] = old + GR[rk][31:0]'
    encoding:
    - bits:
      - 31
      - 25
      value: '0011100'
      kind: fixed
    - bits:
      - 24
      - 20
      value: '00110'
      kind: fixed
    - bits:
      - 19
      - 15
      value: '00010'
      kind: fixed
    - bits:
      - 14
      - 10
      value: rk
      kind: reg
    - bits:
      - 9
      - 5
      value: rj
      kind: reg
    - bits:
      - 4
      - 0
      value: rd
      kind: reg
    base: '0x38610000'
    encoding_value: 0x38610000 | (rk << 10) | (rj << 5) | rd
  - mnemonic: amadd_db.b
    operands: rd, rk, rj
    cn_name: 字节原子加法
    en_name: Atomic Add Byte
    format: 3R 型
    isa:
    - LA64
    equation: GR[rd] = old; Mem[GR[rj]] = old + GR[rk]
    description: 原子加法：读出 `[rj]` 中的 8 位旧值，符号扩展至 GRLEN 位后写入 `rd`；将旧值与 `rk` 的低 8 位相加，结果写回 `[rj]`。整个“读—改—写”过程原子完成。该指令附加数据屏障（DB）语义。
    example: amadd_db.b $a0, $a1, $a2
    example_comment: '# [mem] += $a1[7:0]; $a0 = old'
    pseudocode: 'old = Memory[GR[rj], 8]

      GR[rd] = SignExtend(old, GRLEN)

      Memory[GR[rj], 8] = old + GR[rk][7:0]

      DataBarrier()'
    encoding:
    - bits:
      - 31
      - 25
      value: '0011100'
      kind: fixed
    - bits:
      - 24
      - 20
      value: '00101'
      kind: fixed
    - bits:
      - 19
      - 15
      value: '11110'
      kind: fixed
    - bits:
      - 14
      - 10
      value: rk
      kind: reg
    - bits:
      - 9
      - 5
      value: rj
      kind: reg
    - bits:
      - 4
      - 0
      value: rd
      kind: reg
    base: '0x385f0000'
    encoding_value: 0x385f0000 | (rk << 10) | (rj << 5) | rd
    extra_tags:
    - DB
  - mnemonic: amadd_db.d
    operands: rd, rk, rj
    cn_name: 双字原子加法
    en_name: Atomic Add Doubleword
    format: 3R 型
    isa:
    - LA64
    equation: GR[rd] = old; Mem[GR[rj]] = old + GR[rk]
    description: 原子加法：读出 `[rj]` 中的 64 位旧值，符号扩展至 GRLEN 位后写入 `rd`；将旧值与 `rk` 的低 64 位相加，结果写回 `[rj]`。地址必须自然对齐，否则触发非对齐异常。整个“读—改—写”过程原子完成。该指令附加数据屏障（DB）语义。
    example: amadd_db.d $a0, $a1, $a2
    example_comment: '# [mem] += $a1[63:0]; $a0 = old'
    pseudocode: 'old = Memory[GR[rj], 64]

      GR[rd] = SignExtend(old, GRLEN)

      Memory[GR[rj], 64] = old + GR[rk][63:0]

      DataBarrier()'
    encoding:
    - bits:
      - 31
      - 25
      value: '0011100'
      kind: fixed
    - bits:
      - 24
      - 20
      value: '00110'
      kind: fixed
