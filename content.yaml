- letter: S
  title: S · 减法、移位、存储与系统指令
  note: 本章中的存储地址为 `GR[rj] + si12` 或 `GR[rj] + GR[rk]`；`offs` 如无特别说明均为汇编中的字节偏移。
  instructions:
  - mnemonic: sc.d
    operands: rd, rj, si14
    cn_name: 条件存储（双字）
    en_name: Store Conditional Doubleword
    format: 2RI14 型
    isa: *id002
    equation: if (LLbit) [GR[rj]+si14] = GR[rd]; GR[rd] = success
    description: LLbit 为 1 时将 `rd` 64 位写入 `rj + si14`，并把成功标志写入 `rd`。
    example: sc.d $a0, $a1, 0
    example_comment: '# if (LLbit) [$a1] = $a0; $a0 = success'
    pseudocode: "if (LLbit) {\n    Memory[GR[rj] + si14] = GR[rd]\n    GR[rd] = 1\n} else {\n    GR[rd] = 0\n}"
    encoding:
    - bits:
      - 31
      - 24
      value: '00100011'
      kind: fixed
    - bits:
      - 23
      - 10
      value: si14
      kind: imm
    - bits:
      - 9
      - 5
      value: rj
      kind: reg
    - bits:
      - 4
      - 0
      value: rd
      kind: reg
    base: '0x23000000'
    encoding_value: 0x23000000 | ((si14 & 0x3fff) << 10) | (rj << 5) | rd
  - mnemonic: sc.q
    operands: rd, rk, rj
    cn_name: 条件存储（128 位）
    en_name: Store Conditional Quadword
    format: 3R 型
    isa: *id002
    equation: if (LLbit) [GR[rj]] = {GR[rk], GR[rd]}; GR[rd] = success
    description: LLbit 为 1 时把 `{rk, rd}` 组成的 128 位数据写入 `rj` 地址，并把成功标志写入 `rd`。
    example: sc.q $a0, $a1, $a2
    example_comment: '# if (LLbit) [$a2] = {$a1,$a0}; $a0 = success'
    pseudocode: "if (LLbit) {\n    Memory[GR[rj]] = {GR[rk], GR[rd]}\n    GR[rd] = 1\n} else {\n    GR[rd] = 0\n}"
    encoding:
    - bits:
      - 31
      - 25
      value: '0011100'
      kind: fixed
    - bits:
      - 24
      - 20
      value: '00101'
      kind: fixed
    - bits:
      - 19
      - 15
      value: '01110'
      kind: fixed
    - bits:
      - 14
      - 10
      value: rk
      kind: reg
    - bits:
      - 9
      - 5
      value: rj
      kind: reg
    - bits:
      - 4
      - 0
      value: rd
      kind: reg
    base: '0x38570000'
    encoding_value: 0x38570000 | (rk << 10) | (rj << 5) | rd
