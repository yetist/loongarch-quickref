- letter: I
  title: I · IOCSR、空闲、TLB 无效与指令屏障
  note: ''
  instructions:
  - mnemonic: ibar
    operands: hint
    cn_name: 指令屏障
    en_name: Instruction Barrier
    format: I15 型
    isa: *id001
    equation: InstructionBarrier(hint)
    description: 保证 `IBAR` 之后的取指能看到之前所有存储操作的效果；`hint=0` 为默认完全屏障。
    example: ibar 0
    example_comment: '# 完全指令屏障'
    pseudocode: InstructionBarrier(hint)
    encoding:
    - bits:
      - 31
      - 25
      value: '0011100'
      kind: fixed
    - bits:
      - 24
      - 20
      value: '00111'
      kind: fixed
    - bits:
      - 19
      - 15
      value: '00101'
      kind: fixed
    - bits:
      - 14
      - 0
      value: hint
      kind: imm
    base: '0x38728000'
    encoding_value: 0x38728000 | ((hint & 0x7fff) << 0)
  - mnemonic: idle
    operands: level
    cn_name: 空闲等待
    en_name: Idle
    format: I15 型
    isa: *id001
    equation: WaitForInterrupt(level)
    description: 停止取指并进入等待状态，直到中断或复位唤醒；`level` 为等待级别。
    example: idle 0
    example_comment: '# 进入空闲等待'
    pseudocode: WaitForInterrupt(level)
    encoding:
    - bits:
      - 31
      - 25
      value: '0000011'
      kind: fixed
    - bits:
      - 24
      - 20
      value: '00100'
      kind: fixed
    - bits:
      - 19
      - 15
      value: '10001'
      kind: fixed
    - bits:
      - 14
      - 0
      value: level
      kind: imm
    base: '0x06488000'
    encoding_value: 0x06488000 | ((level & 0x7fff) << 0)
  - mnemonic: invtlb
    operands: op, rj, rk
    cn_name: 无效 TLB
    en_name: Invalidate TLB
    format: 3R 型
    isa: *id001
    equation: InvalidateTLB(op, GR[rj], GR[rk])
    description: 按 `op` 指定的方式无效 TLB 表项；`rj`、`rk` 提供地址/ASID 等参数。
    example: invtlb 0, $a0, $a1
    example_comment: '# 按 op=0 无效 TLB'
    pseudocode: InvalidateTLB(op, GR[rj], GR[rk])
    encoding:
    - bits:
      - 31
      - 25
      value: '0000011'
      kind: fixed
    - bits:
      - 24
      - 20
      value: '00100'
      kind: fixed
    - bits:
      - 19
      - 15
      value: '10011'
      kind: fixed
    - bits:
      - 14
      - 10
      value: rk
      kind: reg
    - bits:
      - 9
      - 5
      value: rj
      kind: reg
    - bits:
      - 4
      - 0
      value: op
      kind: imm
    base: '0x06498000'
    encoding_value: 0x06498000 | (rk << 10) | (rj << 5) | ((op & 0x1f) << 0)
  - mnemonic: iocsrrd.b
    operands: rd, rj
    cn_name: IOCSR 读（字节）
    en_name: IOCSR Read Byte
    format: 2R 型
    isa: *id001
    equation: GR[rd] = IOCSR[GR[rj]]
    description: 从 IOCSR 地址 `rj` 读取字节数据。
    example: iocsrrd.b $a0, $a1
    example_comment: '# IOCSR read'
    pseudocode: GR[rd] = IOCSR[GR[rj]]
    encoding:
    - bits:
      - 31
      - 25
      value: '0000011'
      kind: fixed
    - bits:
      - 24
      - 20
      value: '00100'
      kind: fixed
    - bits:
      - 19
      - 15
      value: '10000'
      kind: fixed
    - bits:
      - 14
      - 10
      value: '00000'
      kind: fixed
    - bits:
      - 9
      - 5
      value: rj
      kind: reg
    - bits:
      - 4
      - 0
      value: rd
      kind: reg
    base: '0x06480000'
    encoding_value: 0x06480000 | (rj << 5) | rd
