  - mnemonic: ori
    operands: rd, rj, ui12
    cn_name: 立即数按位或
    en_name: Bitwise OR Immediate
    format: 2RI12 型
    isa: *id001
    equation: GR[rd] = GR[rj] | ZeroExtend(ui12, GRLEN)
    description: 将 `rj` 与零扩展的 12 位立即数按位或，结果写入 `rd`。
