  - mnemonic: ld.b
    operands: rd, rj, si12
    cn_name: 加载（字节符号扩展）
    en_name: Load Byte Signed
    format: 2RI12 型
    isa: *id001
    equation: GR[rd] = SignExtend(Memory[GR[rj]+si12, 8), GRLEN)
    description: 从 `rj + si12` 加载 8 位数据，符号扩展至 GRLEN 后写入 `rd`。
    example: ld.b $a0, $a1, 0
    example_comment: '# $a0 = [$a1]'
    pseudocode: GR[rd] = SignExtend(Memory[GR[rj]+si12, 8), GRLEN)
    encoding:
    - bits:
      - 31
      - 22
      value: '0010100000'
      kind: fixed
    - bits:
      - 21
      - 10
      value: si12
      kind: imm
    - bits:
      - 9
      - 5
      value: rj
      kind: reg
    - bits:
      - 4
      - 0
      value: rd
      kind: reg
    base: '0x28000000'
    encoding_value: 0x28000000 | ((si12 & 0xfff) << 10) | (rj << 5) | rd
